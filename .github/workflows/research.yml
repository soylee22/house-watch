name: Refresh public housing research

on:
  schedule:
    - cron: '37 7 * * 1'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: Download the current official sales and HPI snapshots
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: public-research-pages
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install research dependencies
        run: python -m pip install -r app/requirements-research.txt
      - name: Test geography and prediction safeguards
        run: |
          python -m unittest discover -s app -p 'test_research.py' -v
          python -m unittest discover -s app -p 'test_attributes.py' -v
      - name: Rebuild public research
        env:
          REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh_sources }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            python app/research_pipeline.py --inputs research-inputs --docs docs --refresh
          else
            python app/research_pipeline.py --inputs research-inputs --docs docs
          fi
          node --check docs/app.js
      - name: Preserve the reproducible public snapshot
        run: |
          git add docs research-inputs
          if ! git diff --cached --quiet; then
            git -c user.name='House Watch' -c user.email='house-watch@users.noreply.github.com' commit -m 'Refresh official housing research snapshot'
            git push
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs
      - name: Deploy the public research website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
