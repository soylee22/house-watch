name: Refresh public housing research

on:
  schedule:
    - cron: '37 7 * * 1'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: Download the current official sales and HPI snapshots
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: public-research-pages
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install research dependencies
        run: python -m pip install -r app/requirements-research.txt
      - name: Test geography and prediction safeguards
        run: python -m unittest discover -s app -p 'test_research.py' -v
      - name: Rebuild public research
        env:
          REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh_sources }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            python app/research_pipeline.py --inputs research-inputs --docs docs --refresh
          else
            python app/research_pipeline.py --inputs research-inputs --docs docs
          fi
          node --check docs/app.js
      - name: Preserve the reproducible public snapshot
        run: |
          git add docs research-inputs
          if ! git diff --cached --quiet; then
            git -c user.name='House Watch' -c user.email='house-watch@users.noreply.github.com' commit -m 'Refresh official housing research snapshot'
            git push
          fi
      - name: Request and verify the standard Pages branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages/builds" --method POST
          python - <<'PY'
          import json, os, subprocess, time
          expected=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          endpoint='repos/'+os.environ['GITHUB_REPOSITORY']+'/pages/builds/latest'
          for attempt in range(60):
              result=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
              if result.get('commit')==expected and result['status']=='built':
                  print('Verified the published research snapshot '+expected)
                  break
              if result.get('commit')==expected and result['status']=='errored':
                  raise RuntimeError('Pages branch build failed')
              time.sleep(5)
          else:
              raise TimeoutError('Pages has not completed the expected branch build')
          PY
